name: Weekly backup
# Also keeps the free Supabase project from auto-pausing (it signs in and reads data).
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Dump data
        run: node scripts/backup.mjs "$RUNNER_TEMP/backup.json"
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      # This repo is public and workflow artifacts of public repos can be downloaded by any
      # GitHub user, so the file MUST be encrypted before it is uploaded.
      - name: Encrypt
        run: |
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$RUNNER_TEMP/backup.json.gpg" "$RUNNER_TEMP/backup.json"
          rm -f "$RUNNER_TEMP/backup.json"
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: reptile-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.json.gpg
          retention-days: 90
